<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blackjack Game</title>
    <link rel="stylesheet" href="style.css">
    <script src="/socket.io/socket.io.js"></script>
</head>
<body class="game-page">
    <div id="game-container">
        <div id="dealer-area">
            <div class="dealer-label">DEALER</div>
            <div id="dealer-cards" class="cards-container"></div>
            <div id="dealer-score" class="score-display"></div>
        </div>
        
        <div id="players-area">
            <div id="seats-container"></div>
        </div>
        
        <div id="controls-area">
            <div id="player-info">
                <div id="your-balance"></div>
                <div id="your-bet"></div>
            </div>
            <div id="chips-area" class="hidden">
                <div class="chips-label">YOUR CHIPS - CLICK TO BET</div>
                <div id="chips-container"></div>
                <div id="bet-controls">
                    <button onclick="clearBet()" class="control-btn clear-btn" id="clear-bet-btn" disabled>Clear Bet</button>
                    <button onclick="confirmBet()" class="control-btn confirm-btn" id="confirm-bet-btn" disabled>Confirm Bet</button>
                </div>
            </div>
            <div id="action-controls" class="hidden">
                <button onclick="hit()" class="action-btn hit-btn">HIT</button>
                <button onclick="stand()" class="action-btn stand-btn">STAND</button>
            </div>
            <div id="spectator-message" class="hidden">
                <p>Spectating - You'll join next round</p>
            </div>
        </div>
        
        <div id="game-phase" class="phase-display"></div>
        <div id="message-area"></div>
    </div>

    <script src="game.js"></script>
</body>
</html>
